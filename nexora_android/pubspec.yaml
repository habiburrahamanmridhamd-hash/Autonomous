name: nexora
description: "NEXORA — One World. One Platform. All-in-one Android social media application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  dio: ^5.7.0
  web_socket_channel: ^3.0.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  cached_network_image: ^3.4.1
  video_player: ^2.9.2
  chewie: ^1.8.5
  image_picker: ^1.1.2
  record: ^5.1.2
  just_audio: ^0.9.40
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.5.0
  path_provider: ^2.1.4
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/nexora_icon.png"
  adaptive_icon_background: "#080B14"
  adaptive_icon_foreground: "assets/branding/nexora_icon_fg.png"

flutter_native_splash:
  color: "#080B14"
  color_dark: "#080B14"
  android_12:
    color: "#080B14"
