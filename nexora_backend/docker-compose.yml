version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora_secret
      POSTGRES_DB: nexora_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nexora:nexora_secret@postgres:5432/nexora_db
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - media_uploads:/app/media_uploads

volumes:
  pgdata:
  media_uploads:
